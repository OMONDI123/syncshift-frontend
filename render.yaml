services:
  - type: web
    name: syncshift-frontend
    runtime: static
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    # Without this, Render tries to find a real file at e.g. /schedule and
    # returns 404 on any refresh or direct link — react-router-dom only
    # handles routing client-side, after index.html has already loaded, so
    # every path needs to resolve to the same index.html and let the router
    # take it from there.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_BASE_URL
        sync: false
